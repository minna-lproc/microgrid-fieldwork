name: Test and deploy to PythonAnywhere

on:
  push:
    branches: [main]
    paths:
      - app.py
      - 'templates/**'
      - 'static/**'
      - requirements.txt
      - 'tests/**'
      - .github/workflows/deploy-pythonanywhere.yml
      - scripts/deploy_pythonanywhere.py
      - scripts/generate_codebook.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonanywhere-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test Flask API
        run: python -m pytest -q
      - name: Verify questionnaire codebook
        run: python scripts/generate_codebook.py --check
      - name: Check browser JavaScript syntax
        run: node --check static/app.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload application code and reload
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_PROJECT_DIR: ${{ vars.PYTHONANYWHERE_PROJECT_DIR }}
          PYTHONANYWHERE_USERNAME: kadlaon
          PYTHONANYWHERE_DOMAIN: kadlaon.pythonanywhere.com
          PYTHONANYWHERE_HOST: www.pythonanywhere.com
        run: python scripts/deploy_pythonanywhere.py
